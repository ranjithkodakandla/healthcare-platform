name: Bug Report
description: Report a defect in API, Citizen, Provider, Admin, or infrastructure
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Citizen App
        - Provider Portal
        - Admin Console
        - Infrastructure / CI
        - Playwright / QA
        - Privacy / DPDP
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. local / Cloud Run dev / staging
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, Playwright trace IDs (no secrets/PII)
