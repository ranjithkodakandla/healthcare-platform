# Cloud Build for Next.js web apps (used when local Docker is unavailable).
# Example:
#   gcloud builds submit --config=apps/cloudbuild-web.yaml \
#     --substitutions=_APP_NAME=admin-console,_IMAGE=...,_NEXT_PUBLIC_API_URL=...
substitutions:
  _APP_NAME: admin-console
  _IMAGE: asia-south1-docker.pkg.dev/sahyak/sahayak-dev/admin-console:latest
  _NEXT_PUBLIC_API_URL: https://sahayak-dev-api-j2iqu7nnqq-el.a.run.app
  # Defaults are placeholders — always pass real values via --substitutions
  # from apps/<app>/.env.local (empty strings break Firebase client init).
  _NEXT_PUBLIC_FIREBASE_API_KEY: REPLACE_ME
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: sahyak.firebaseapp.com
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: sahyak
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: sahyak.firebasestorage.app
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: REPLACE_ME
  _NEXT_PUBLIC_FIREBASE_APP_ID: REPLACE_ME

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web.Dockerfile
      - --build-arg
      - APP_NAME=${_APP_NAME}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
